<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ff">
  <title>Catalogue — NovaTech Cameroun</title>
  <meta name="description" content="Tout le hardware NovaTech : smartphones, laptops, audio, montres, tablettes, accessoires et gaming. Prix FCFA, livraison 24h Douala & Yaoundé.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/catalog.css">
</head>
<body>
  <a class="sr-only" href="#main">Aller au contenu</a>
  <div id="app-header"></div>

  <main class="page-main" id="main">
    <div class="container">
      <header class="catalog-head">
        <nav class="breadcrumb" aria-label="Fil d'Ariane">
          <a href="index.html" data-i18n="nav.home">Accueil</a>
          <span class="material-symbols-outlined">chevron_right</span>
          <span data-breadcrumb>Catalogue</span>
        </nav>
        <div class="catalog-head__row">
          <div>
            <p class="t-eyebrow" data-i18n="catalog.eyebrow">Filière phare</p>
            <h1 class="t-h1" id="catalog-title">Catalogue</h1>
          </div>
          <span class="catalog-head__count"><strong id="result-count">0</strong> <span data-i18n="catalog.products">produits</span></span>
        </div>
      </header>

      <div class="chip-row" id="category-rail" aria-label="Catégories"></div>

      <div class="catalog-active" id="active-filters"></div>

      <div class="catalog-toolbar">
        <button class="btn btn--ghost btn--sm filters-trigger" type="button" data-open-filters>
          <span class="material-symbols-outlined">tune</span>
          <span data-i18n="common.filters">Filtres</span>
          <span class="badge badge--primary" id="filters-count" hidden>0</span>
        </button>

        <label class="toolbar__search">
          <span class="material-symbols-outlined">search</span>
          <input type="search" id="catalog-search" autocomplete="off" placeholder="Rechercher…" aria-label="Rechercher dans le catalogue">
        </label>

        <button class="btn btn--ghost btn--sm" type="button" data-open-sort>
          <span class="material-symbols-outlined">swap_vert</span>
          <span id="sort-label">Recommandés</span>
        </button>

        <div class="toolbar__spacer"></div>

        <div class="segmented view-toggle" role="group" aria-label="Affichage">
          <button type="button" data-view="grid" aria-pressed="true" title="Grille">
            <span class="material-symbols-outlined">grid_view</span>
          </button>
          <button type="button" data-view="list" aria-pressed="false" title="Liste">
            <span class="material-symbols-outlined">view_list</span>
          </button>
        </div>
      </div>

      <div class="catalog-layout">
        <div class="filter-scrim" data-close-filters hidden></div>
        <aside class="filters-drawer" id="filters-panel" aria-label="Filtres"></aside>

        <section class="catalog-results" aria-live="polite">
          <div class="grid grid--products" id="results"></div>
          <div class="catalog-more" id="load-more-wrap"></div>
        </section>
      </div>

      <section class="quick-spec" id="quick-spec"></section>
    </div>
  </main>

  <div class="sheet" id="sort-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sort-title">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sort-title" data-i18n="catalog.sort.title">Trier par</h2>
      <button class="icon-btn icon-btn--sm" type="button" data-sheet-close aria-label="Fermer">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="sheet__body">
      <div class="sort-list" id="sort-list" role="radiogroup"></div>
    </div>
    <div class="sheet__foot">
      <button class="btn btn--ghost" type="button" id="sort-reset" data-i18n="common.reset">Réinitialiser</button>
      <button class="btn" type="button" id="sort-apply" data-i18n="catalog.sort.apply">Appliquer le tri</button>
    </div>
  </div>

  <div id="app-nav"></div>
  <div id="app-footer"></div>

  <script type="module" src="js/pages/catalog.js"></script>
</body>
</html>
