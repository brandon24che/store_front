<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ff">
  <title>Mes favoris — NovaTech Cameroun</title>
  <meta name="description" content="Retrouvez les appareils NovaTech que vous avez sauvegardés. Ajoutez-les au panier et commandez sur WhatsApp.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/catalog.css">
  <link rel="stylesheet" href="css/pages/wishlist.css">
</head>
<body>
  <a class="sr-only" href="#main">Aller au contenu</a>
  <div id="app-header"></div>

  <main class="page-main" id="main">
    <div class="container">
      <header class="wishlist-head">
        <div>
          <p class="t-eyebrow" data-i18n="wishlist.eyebrow">Votre sélection</p>
          <h1 data-i18n="wishlist.title">Mes favoris</h1>
          <span class="wishlist-count"><strong id="wishlist-count">0</strong> <span data-i18n="catalog.products">produits</span></span>
        </div>
        <div class="wishlist-head__actions" id="wishlist-actions" hidden>
          <button class="btn btn--ghost btn--sm" type="button" id="wishlist-clear">
            <span class="material-symbols-outlined">delete_sweep</span><span data-i18n="wishlist.clear">Tout retirer</span>
          </button>
          <button class="btn btn--sm" type="button" id="wishlist-add-all">
            <span class="material-symbols-outlined">add_shopping_cart</span><span data-i18n="wishlist.addAll">Tout ajouter au panier</span>
          </button>
        </div>
      </header>

      <p class="wishlist-note">
        <span class="material-symbols-outlined">info</span>
        <span data-i18n="wishlist.note">Vos favoris sont enregistrés sur cet appareil. Les prix sont mis à jour en temps réel.</span>
      </p>

      <div class="grid grid--products" id="wishlist-grid"></div>

      <div class="wishlist-empty" id="wishlist-empty" hidden>
        <span class="wishlist-empty__icon"><span class="material-symbols-outlined">favorite</span></span>
        <h2 data-i18n="wishlist.empty.title">Aucun favori pour l'instant</h2>
        <p data-i18n="wishlist.empty.text">Touchez le cœur sur un produit pour le retrouver ici.</p>
        <a class="btn" href="catalog.html" data-i18n="cart.browse">Explorer le catalogue</a>
      </div>
    </div>
  </main>

  <div id="app-nav"></div>
  <div id="app-footer"></div>

  <script type="module" src="js/pages/wishlist.js"></script>
</body>
</html>
