<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ff">
  <title>NovaTech Cameroun — Hardware premium, livraison 24h Douala & Yaoundé</title>
  <meta name="description" content="Smartphones, laptops, audio et gaming vérifiés. Prix en FCFA, paiement MTN MoMo et Orange Money, livraison 24h à Douala et Yaoundé.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
</head>
<body>
  <a class="sr-only" href="#main">Aller au contenu</a>
  <div id="app-header"></div>

  <main class="page-main" id="main">
    <div class="container">
      <section class="home-search" aria-label="Recherche">
        <form class="search-shell" data-home-search role="search">
          <span class="material-symbols-outlined">search</span>
          <input type="search" name="q" placeholder="Rechercher smartphones, laptops, audio…" aria-label="Rechercher un produit">
          <button class="icon-btn" type="button" aria-label="Recherche vocale" data-voice>
            <span class="material-symbols-outlined">mic</span>
          </button>
          <a class="icon-btn" href="catalog.html" aria-label="Filtres">
            <span class="material-symbols-outlined">tune</span>
          </a>
        </form>
      </section>

      <section id="hero" aria-label="Produit phare"></section>

      <section class="home-cats" id="categories" aria-label="Catégories"></section>

      <section class="section--tight" id="flash" aria-live="polite"></section>

      <section class="section" id="curated">
        <div class="section-head">
          <div>
            <h2 class="t-h2" data-i18n="home.curated.title">Hardware sélectionné</h2>
            <p class="t-sm muted" data-i18n="home.curated.sub">Sélection vérifiée par nos ingénieurs</p>
          </div>
          <a class="section-head__link" href="catalog.html">
            <span data-i18n="common.viewAll">Voir tout</span>
            <span class="material-symbols-outlined">arrow_forward</span>
          </a>
        </div>
        <div class="grid grid--products" id="product-grid"></div>
      </section>

      <section class="section--tight" id="partners"></section>

      <section class="section" id="trust"></section>
    </div>
  </main>

  <div id="app-nav"></div>
  <div id="app-footer"></div>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
